<div id="cascade-fields">
  <div class="field">
    <label for="id_branch">Filial</label>
    <select
      id="id_branch"
      name="branch"
      required
      {% if not branches %}disabled{% endif %}
      hx-get="{% url 'senior-ui:employee-types' %}"
      hx-trigger="change"
      hx-target="#employee-and-types"
      hx-swap="outerHTML"
      hx-include="#senior-reference-form"
      hx-indicator="#cascade-loading"
      hx-disabled-elt="this"
    >
      <option value="">
        {% if branches %}Selecione a filial{% else %}Selecione primeiro a empresa{% endif %}
      </option>
      {% for branch in branches %}
        <option value="{{ branch.branch }}">
          {{ branch.branch }} — {{ branch.legal_name }}
        </option>
      {% endfor %}
    </select>
    {% if branches is not None and not branches %}
      <p class="muted">Nenhuma filial elegível foi encontrada.</p>
    {% endif %}
  </div>

  {% include "senior/partials/employee_and_types.html" %}
</div>
