<div id="employee-and-types">
  <div class="field">
    <label for="id_employee_type">Tipo de colaborador</label>
    <select
      id="id_employee_type"
      name="employee_type"
      required
      {% if not employee_types %}disabled{% endif %}
      hx-get="{% url 'senior-ui:employees' %}"
      hx-trigger="change"
      hx-target="#employee-field"
      hx-swap="outerHTML"
      hx-include="#senior-reference-form"
      hx-indicator="#cascade-loading"
      hx-disabled-elt="this"
    >
      <option value="">
        {% if employee_types %}Selecione o tipo{% else %}Selecione primeiro a filial{% endif %}
      </option>
      {% for employee_type in employee_types %}
        <option value="{{ employee_type.employee_type }}">
          {{ employee_type.employee_type }} — {{ employee_type.description }}
        </option>
      {% endfor %}
    </select>
    {% if employee_types is not None and not employee_types %}
      <p class="muted">Nenhum tipo de colaborador elegível foi encontrado.</p>
    {% endif %}
  </div>

  {% include "senior/partials/employee_field.html" %}
</div>
