{% extends "base.html" %}
{% block title %}Entrar — SGPD{% endblock %}
{% block content %}
  <section class="card">
    <h1>Entrar no SGPD</h1>
    {% if form.errors %}<p class="errorlist">Login ou senha inválidos.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
