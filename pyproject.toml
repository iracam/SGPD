[project]
name = "sgpd"
version = "0.1.0"
description = "SGPD / DesligaFlow — Sistema de Gestão do Processo Demissional"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Runtime assíncrono da ADR-057: worker e Beat no lugar do agendador do
    # sistema operacional. O extra `redis` traz o cliente que o broker usa e
    # que o `RedisCache` nativo do Django 5.2 também consome — por isso não
    # entra `django-redis`.
    "celery[redis]>=5.5,<6",
    "cryptography>=49,<50",
    "django>=5.2.8,<5.3",
    "django-auth-ldap>=5.3,<5.4",
    "djangorestframework>=3.17.1,<3.18",
    # Servidor WSGI do host publicado. Substitui o `runserver`, que é servidor de
    # desenvolvimento atendendo tráfego real desde a entrada do proxy (R68).
    "gunicorn>=23,<24",
    "oracledb>=3.4,<5",
    "python-ldap>=3.4.7,<3.5",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    # O Celery não publica `py.typed`; sem os stubs o Mypy estrito recusa o
    # módulo inteiro e as tarefas ficariam sem tipagem.
    "celery-types>=0.23,<1",
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.16,<4",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
